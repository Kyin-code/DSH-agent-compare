[package]
name = "agent-compare-engine"
version = "0.1.0"
edition = "2021"
description = "Native diff and project-scan engine for the DSH Agent Compare plugin"
license = "Apache-2.0"

[[bin]]
name = "agent-compare-engine"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "2"
walkdir = "2"

[profile.release]
opt-level = 2
lto = false
strip = true
